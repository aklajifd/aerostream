name: C++ CI Build

on: 
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Build Essentials
      run: sudo apt-get update && sudo apt-get install -y build-essential

    - name: Compile C++ Producer
      run: g++ main.cpp -o telemetry_sim -pthread

    - name: Verify Build
      run: ./telemetry_sim --help || echo "Build Successful"
     