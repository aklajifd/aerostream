<!DOCTYPE html>
<html>
<head>
    <title>AeroStream Dashboard</title>
    <style>
        body { font-family: 'Courier New', monospace; background: #0b0e14; color: #00ff41; padding: 20px; }
        .packet { border: 1px solid #00ff41; padding: 10px; margin: 10px 0; border-radius: 5px; }
        h1 { border-bottom: 2px solid #00ff41; }
    </style>
</head>
<body>
    <h1>🛰️ AEROSTREAM LIVE TELEMETRY</h1>
    <div id="data-container">Waiting for satellite lock...</div>

    <script>
        function updateDashboard() {
            fetch('/api/data')
                .then(response => response.json())
                .then(data => {
                    let html = '';
                    data.forEach(row => {
                        html += `<div class="packet">
                            <strong>[${row[1]}]</strong> ${row[2]} <br>
                            <small>Time: ${row[3]}</small>
                        </div>`;
                    });
                    document.getElementById('data-container').innerHTML = html;
                });
        }
        // Refresh every 2 seconds
        setInterval(updateDashboard, 2000);
    </script>
</body>
</html>
